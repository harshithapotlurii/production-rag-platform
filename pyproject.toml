[project]
name = "production-rag-platform"
version = "0.1.0"
description = "A reproducible RAG reference implementation with grounded citations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

